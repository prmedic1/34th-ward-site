name: Daily data refresh

# Runs on GitHub's servers - works even when your computer is off.
# Refreshes the mayor's-race odds (Kalshi) and the happy-hour sheet snapshot,
# then commits + pushes, which triggers Netlify to redeploy automatically.
on:
  schedule:
    # GitHub often delays scheduled runs, sometimes by hours, so we ask twice.
    # The refresh script is idempotent, so a duplicate run is harmless.
    # GitHub's free-tier scheduler runs these ~4 HOURS LATE and consistently
    # (13:02 UTC was actually firing ~17:00 UTC = noon Central, so the site was
    # stale every morning). So we schedule ~4h EARLY to compensate, and fire
    # several times as a hedge against GitHub dropping a run. The script is
    # idempotent (spotlight rotates once/Chicago-day, news + newsletters dedup),
    # so extra runs are harmless. Use ODD minutes, never :00/:30 (most congested).
    # Target actual run ~13:00-16:00 UTC (8-11am Central); all are after Axios
    # arrives (~11:29 UTC) once GitHub's delay is applied.
    - cron: '2 9 * * *'   # 09:02 UTC, lands ~13:00 UTC (~8 AM Central) with the ~4h delay
    - cron: '32 10 * * *' # 10:32 UTC, hedge, lands ~14:30 UTC (~9:30 AM Central)
    - cron: '2 12 * * *'  # 12:02 UTC, final net, lands ~16:00 UTC (~11 AM Central)
  workflow_dispatch: {}    # lets you also run it on demand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh public data (Kalshi odds + happy-hour sheet)
        run: node scripts/refresh-data.mjs

      - name: Refresh news from public local feeds + rotate spotlight
        run: node scripts/refresh-news.mjs

      - name: Install newsletter dependencies
        run: npm install --no-save imapflow mailparser

      - name: Summarize email newsletters (Gmail + free Groq AI)
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/refresh-newsletters.mjs

      - name: Log traffic and rate the day (good / usual / bad)
        run: node scripts/track-traffic.mjs

      - name: Commit and push if anything changed
        run: |
          git config user.name "34thward-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Automated daily data refresh ($(date -u +%Y-%m-%d))"
            git push
            echo "Pushed refreshed data."
          else
            echo "No changes to commit."
          fi
