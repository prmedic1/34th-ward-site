name: Daily data refresh

# Runs on GitHub's servers - works even when your computer is off.
# Refreshes the mayor's-race odds (Kalshi) and the happy-hour sheet snapshot,
# then commits + pushes, which triggers Netlify to redeploy automatically.
on:
  # PRIMARY trigger is an EXTERNAL scheduler (cron-job.org) that POSTs to this
  # workflow's dispatch API at 8:00 AM Central every day. It is reliable, unlike
  # GitHub's own cron, which fired these ~4 HOURS LATE and dropped runs, leaving
  # the site stale every morning. The schedule below is only a BACKUP for the
  # rare case the external trigger fails; GitHub delays it, so it lands in the
  # early afternoon Central. Odd minute (never :00/:30, GitHub's congested slots).
  schedule:
    - cron: '2 14 * * *'  # 14:02 UTC backup only; GitHub delay lands it ~early afternoon Central
  workflow_dispatch: {}    # used by the external scheduler (cron-job.org) and for manual runs

permissions:
  contents: write

# Never let two refreshes run at once (the external trigger and the backup cron
# could overlap); serialize them so their git pushes cannot collide.
concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh public data (Kalshi odds + happy-hour sheet)
        run: node scripts/refresh-data.mjs

      - name: Refresh news from public local feeds + rotate spotlight
        run: node scripts/refresh-news.mjs

      - name: Install newsletter dependencies
        run: npm install --no-save imapflow mailparser

      - name: Summarize email newsletters (Gmail + free Groq AI)
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/refresh-newsletters.mjs

      - name: Log traffic and rate the day (good / usual / bad)
        run: node scripts/track-traffic.mjs

      - name: Commit and push if anything changed
        run: |
          git config user.name "34thward-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Automated daily data refresh ($(date -u +%Y-%m-%d))"
            git push
            echo "Pushed refreshed data."
          else
            echo "No changes to commit."
          fi
