name: Retry failed Pages publish

# Watches the site's publish step ("pages build and deployment") and fixes the
# two ways it has broken on GitHub's side:
#   1. The publish FAILS with a GitHub server error (500) -> re-run it.
#   2. GitHub never STARTS a publish for the newest commit -> request one.
# Runs whenever GitHub reports a Pages build (then waits for the publish to
# finish) and hourly as a backup.
# (A workflow_run trigger on the publish step does NOT fire - tested 11/4/2026 -
# because GitHub's built-in Pages workflow is exempt from it.)
# Gives up after 3 attempts on the same commit so it can never loop forever.
on:
  page_build:
  schedule:
    - cron: '17 * * * *'  # hourly (odd minute; GitHub's cron can run late)
  workflow_dispatch: {}

permissions:
  actions: write
  pages: write
  contents: read

concurrency:
  group: pages-retry
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Re-run or request the publish if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(gh api "repos/$REPO/commits/main" --jq .sha)
          HEAD_TIME=$(gh api "repos/$REPO/commits/main" --jq .commit.committer.date)
          AGE_MIN=$(( ( $(date -u +%s) - $(date -u -d "$HEAD_TIME" +%s) ) / 60 ))
          echo "Newest commit ${HEAD_SHA:0:7}, ${AGE_MIN} min old"

          RUN=$(gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&per_page=20" \
            --jq '[.workflow_runs[] | select(.name == "pages build and deployment")] | sort_by(.created_at) | last // empty')

          if [ -z "$RUN" ]; then
            # GitHub skipped this commit. Give it 10 minutes to start on its own first.
            if [ "$AGE_MIN" -ge 10 ]; then
              echo "No publish was started for the newest commit; requesting one."
              gh api -X POST "repos/$REPO/pages/builds" >/dev/null
            else
              echo "Commit is new; waiting for GitHub to start the publish."
            fi
            exit 0
          fi

          ID=$(echo "$RUN" | jq -r .id)
          # page_build fires BEFORE the publish (deploy) step finishes, and a
          # re-run does not fire it again, so this job waits for each attempt to
          # finish and re-runs it itself (up to 3 attempts per commit).
          wait_done() {
            for i in $(seq 1 30); do
              [ "$(echo "$RUN" | jq -r .status)" = "completed" ] && return 0
              sleep 30
              RUN=$(gh api "repos/$REPO/actions/runs/$ID")
            done
            return 1
          }
          while true; do
            if ! wait_done; then echo "Publish still running after 15 min; the hourly check will look again."; exit 0; fi
            CONCLUSION=$(echo "$RUN" | jq -r '.conclusion // ""')
            ATTEMPT=$(echo "$RUN" | jq -r .run_attempt)
            echo "Publish run $ID: $CONCLUSION (attempt $ATTEMPT)"
            if [ "$CONCLUSION" != "failure" ]; then echo "Nothing to fix."; exit 0; fi
            if [ "$ATTEMPT" -ge 3 ]; then
              echo "Already tried 3 times on this commit; leaving it for a person to look at."
              # Fail (which sends one GitHub email) only from a live check, not
              # again on every hourly check.
              if [ "${{ github.event_name }}" != "schedule" ]; then exit 1; fi
              exit 0
            fi
            echo "Publish failed; re-running it."
            sleep 60  # a brief pause helps when GitHub's servers are struggling
            gh api -X POST "repos/$REPO/actions/runs/$ID/rerun-failed-jobs" >/dev/null
            # Wait for GitHub to register the new attempt before checking again.
            for i in $(seq 1 12); do
              sleep 10
              RUN=$(gh api "repos/$REPO/actions/runs/$ID")
              [ "$(echo "$RUN" | jq -r .run_attempt)" -gt "$ATTEMPT" ] && break
            done
          done
