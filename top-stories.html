<style>
  /* Archive: give every story the same fixed-height photo banner so entries
     match. A single photo (Conway, Soul City) fills the banner; a two-photo pair
     (Bean, NASCAR) splits it. Without this, single photos blow up to full size. */
  #top-stories-list .np-lead-media .np-lead-img:only-child {
    height: 320px; width: 100%; max-width: none; margin: 0;
    object-fit: cover; object-position: center 28%;
  }
  /* Soul City: the church's name sign sits at the bottom of the photo, so anchor
     that crop to the bottom to keep the sign readable. */
  #top-stories-list .np-lead-media .np-lead-img[src*="soul-city"] { object-position: center bottom; }
  @media (max-width: 700px) {
    /* On phones the diptych collapses to its primary photo; hold every entry's
       photo to the same height so they line up. */
    #top-stories-list .np-lead-media .np-lead-img {
      height: 210px; object-fit: cover; object-position: center 28%;
    }
  }
</style>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  const TS_DATA_V = '20260907a';

  fetch('data/featured.json?d=' + TS_DATA_V)
    .then((r) => r.json())
    .then((data) => {
      const entries = [];
      if (data.current) entries.push(data.current);
      if (Array.isArray(data.history)) entries.push(...data.history);
      const list = document.getElementById('top-stories-list');
      if (!entries.length) {
        list.innerHTML = '<p class="empty-state">No top stories yet.</p>';
        return;
      }
      list.innerHTML = entries.map(renderEntry).join('');
    })
    .catch((err) => {
      console.error('Failed to load top stories', err);
      document.getElementById('top-stories-list').innerHTML =
        '<p class="empty-state">Unable to load top stories right now.</p>';
    });

  function renderEntry(s) {
    const img = s.image
      ? `<img class="np-lead-img" src="${escapeAttr(s.image)}" alt="${escapeAttr(s.image_alt || '')}" loading="lazy" onerror="this.remove()">`
      : '';
    const img2 = s.image2
      ? `<img class="np-lead-img2" src="${escapeAttr(s.image2)}" alt="${escapeAttr(s.image2_alt || '')}" loading="lazy" onerror="this.remove()">`
      : '';
    const media = (img || img2)
      ? `<div class="np-lead-media${(img && img2) ? ' np-lead-media-two' : ''}">${img}${img2}</div>`
      : '';
    let body;
    if (s.type === 'statement') {
      const paras = (s.paragraphs || []).map((p) => `<p>${escapeHtml(p)}</p>`).join('');
      body = `${s.intro ? `<p class="np-lead-intro">${escapeHtml(s.intro)}</p>` : ''}` +
        `<blockquote class="np-lead-statement">${paras}</blockquote>` +
        `${s.attribution ? `<p class="np-lead-attr">${escapeHtml(s.attribution)}</p>` : ''}`;
    } else {
      const read = s.url
        ? `<p class="np-lead-attr">Read the full story at <a href="${escapeAttr(s.url)}" target="_blank" rel="noopener">${escapeHtml(s.source_name || 'the source')}</a></p>`
        : '';
      body = `<p class="np-lead-summary">${escapeHtml(s.summary || '')}</p>${read}`;
    }
    const kicker = s.date_label ? escapeHtml(s.date_label) : escapeHtml(s.kicker || 'Top Story');
    return `<article class="np-lead">${media}<div class="np-lead-body">` +
      `<p class="np-lead-kicker">${kicker}</p>` +
      `<h4 class="np-lead-headline">${escapeHtml(s.headline || '')}</h4>${body}</div></article>`;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function escapeAttr(str) {
    return String(str).replace(/"/g, '&quot;');
  }
</script>
